<div class="page-hero">

<script src="data/content.js"></script>
<script src="js/lang.js"></script>
<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  function renderTeaching() {
    const c = content[currentLang];
    if (!c.teaching.courses || c.teaching.courses.length === 0) {
      document.getElementById('teaching-content').innerHTML =
        `<p style="color:var(--muted); font-style:italic; padding:2rem 0;">${c.teaching.placeholder}</p>`;
      return;
    }
    document.getElementById('teaching-content').innerHTML = c.teaching.courses.map(group => `
      <div class="course-group">
        <div class="course-level">${group.level}</div>
        <ul class="course-list">
          ${group.list.map(course => `<li>${course}</li>`).join('')}
        </ul>
      </div>`).join('');
  }
</script>
</body>
